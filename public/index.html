<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1c">
<title>B4 GAME STATION</title>
<link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0e1c;--sf:#111731;--cd:#161d3a;--cd2:#1c2447;--ln:#28315a;--tx:#eef1ff;--mu:#8e97c0;--ac:#3d7bff;--ac2:#6fa8ff;--ok:#3ec7a4;--er:#ff5a6e;--wr:#ffb347;--pk:#e28fd4;--pu:#8b5cf6;--pu2:#b794ff;--r:16px;
 --fd:'Chakra Petch',ui-monospace,system-ui,sans-serif;--fb:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(900px 420px at 85% -120px,#1a2a6c55,transparent 70%),radial-gradient(700px 380px at -10% 110%,#3a1a5c33,transparent 70%),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.5 var(--fb);min-height:100vh}
h1,h2,h3{font-family:var(--fd);text-wrap:balance;margin:0}
h2{font-size:24px;letter-spacing:.3px}h3{font-size:18px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
button{background:var(--cd2);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s,transform .1s}
button:hover:not(:disabled){border-color:var(--ac2)}button:active:not(:disabled){transform:scale(.97)}
button.p{background:linear-gradient(135deg,var(--pu),var(--ac));border-color:transparent;color:#fff;font-weight:600}
button.g{background:var(--ok);border-color:var(--ok);color:#052a20;font-weight:700}
button.d{background:transparent;border-color:var(--er);color:var(--er)}
button.ghost{background:transparent}
button.link{background:none;border:0;color:var(--ac2);min-height:0;padding:4px;font-size:14px}
button:disabled{opacity:.45;cursor:not-allowed}
button svg{flex:none}
input,select,textarea{background:#0b1026;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;width:100%;min-height:46px}
textarea{min-height:84px;resize:vertical;font:inherit;color:inherit;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--ac2);outline:none}
input[type=file]{padding:8px}
label{display:block;margin:14px 0 6px;color:var(--mu);font-size:13px;font-weight:500}
.mu{color:var(--mu);font-size:13px}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:#0a0e1ce6;backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.hbar{max-width:1240px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.hlogo{height:46px;width:auto;margin:-4px 0}
.plogo{display:block;height:clamp(150px,30vw,250px);width:auto;max-width:100%;margin:4px auto 10px;filter:drop-shadow(0 14px 34px #8b55ff40)}
.logo h1{font-size:19px;letter-spacing:1px;line-height:1.1}.logo h1 span{color:var(--ac2)}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--pk));font-weight:700;color:#fff;flex:none}
.who .role{color:var(--mu);font-size:12px;line-height:1.1}
nav{display:flex;gap:4px}
nav button{background:transparent;border-color:transparent;color:var(--mu);flex-direction:column;gap:2px;padding:6px 12px;font-size:12px;min-width:68px}
nav button.on{color:var(--tx);background:var(--cd2);border-color:var(--ln)}
nav button.on svg{color:var(--ac2)}
main{max-width:1240px;margin:auto;padding-block:18px 40px;padding-inline:16px}
@media (max-width:820px){
 nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#0d1226f5;backdrop-filter:blur(10px);border-top:1px solid var(--ln);justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
 nav button{min-width:0;flex:1;padding:6px 2px}
 main{padding-bottom:110px}
 .who .nm{display:none}
}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);padding:16px}
.warn{display:flex;gap:10px;align-items:center;background:#3a2a0f;border:1px solid #6b4c16;color:#ffd79a;padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:14px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.top p{margin:2px 0 0}
.empty{display:grid;place-items:center;text-align:center;gap:6px;padding:36px 16px;color:var(--mu)}
.empty svg{width:120px;opacity:.8}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{display:flex;align-items:center;gap:12px;background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.tile .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.tile b{display:block;font:700 24px/1.1 var(--fd);font-variant-numeric:tabular-nums}
.tile span{color:var(--mu);font-size:13px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.fch{border-radius:99px;min-height:38px;padding:6px 14px;font-size:14px;white-space:nowrap;background:var(--sf)}
.fch.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.fch em{font-style:normal;opacity:.65;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.unit{background:var(--cd);border:1px solid var(--ln);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.unit.s-play{border-color:#2d4ea8}.unit.s-over{border-color:var(--er);box-shadow:0 0 0 1px var(--er),0 0 24px #ff5a6e33}.unit.s-pay{border-color:#7a5a1f}.unit.s-maint{opacity:.7}
.art{position:relative;height:118px;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 100%,var(--g1),var(--g2));overflow:hidden}
.art::after{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff14 1px,transparent 1.2px);background-size:12px 12px;pointer-events:none}
.art svg.cart{width:150px;height:auto;filter:drop-shadow(0 10px 14px #0008);position:relative;z-index:1;transition:transform .3s}
.unit:hover .art svg.cart{transform:translateY(-3px) rotate(-2deg)}
.t-ps5{--g1:#3a5bd1;--g2:#141c3c}.t-ps4{--g1:#1d3f99;--g2:#0f1530}.t-ps3{--g1:#39405e;--g2:#12162a}.t-ns{--g1:#7a2440;--g2:#10263d}.t-xb{--g1:#1c6b3e;--g2:#0e1c1a}
.num-tag{position:absolute;left:12px;top:10px;z-index:2;font:700 13px var(--fd);letter-spacing:1px;background:#0009;padding:3px 9px;border-radius:8px}
.badge{position:absolute;right:10px;top:10px;z-index:2;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#000a;backdrop-filter:blur(4px)}
.c-free{color:var(--ok)}.c-play{color:var(--ac2)}.c-over{color:var(--er)}.c-pay{color:var(--wr)}.c-maint{color:var(--mu)}
.ub{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.uh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.uh h3{font-size:19px}
.rate{font-size:13px;color:var(--mu)}
.tm{font:700 34px/1 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:1px}
.s-over .tm{color:var(--er)}
.tml{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px}
.bar{height:6px;border-radius:9px;background:#0b1026;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px}
.s-over .bar i{background:var(--er)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px}
.meta span{color:var(--mu)}.meta b{font-weight:600;text-align:right}
.bill-est{display:flex;justify-content:space-between;align-items:center;background:var(--sf);border-radius:10px;padding:8px 12px;font-size:13px}
.bill-est b{font:700 17px var(--fd)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:4px}
.acts .full{grid-column:1/-1}
.idle{color:var(--mu);font-size:14px;margin:4px 0 0}
#m{position:fixed;inset:0;background:#02040cc4;backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:9}
.sheet{position:relative;background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:20px;width:100%;max-width:520px;margin:24px 0}
.sheet h3{font-size:21px;padding-right:44px}
.x{position:absolute;right:12px;top:12px;width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;background:var(--sf)}
.foot{display:flex;gap:10px;margin-top:18px}.foot>*{flex:1}
@media (max-width:600px){#m{align-items:flex-end;padding:0}.sheet{margin:0;border-radius:22px 22px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
.mhead{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.mhead svg.cart{width:84px;flex:none}
.opts{display:grid;gap:8px}
.opt,.seg label{margin:0;cursor:pointer}
.opt input,.seg input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:flex;flex-direction:column;border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:10px 14px;color:var(--tx)}
.opt span small{color:var(--mu);font-size:12.5px}
.opt input:checked+span{border-color:var(--ac2);background:#1a2a60;box-shadow:inset 0 0 0 1px var(--ac2)}
.opt input:focus-visible+span,.seg input:focus-visible+span{outline:2px solid var(--ac2);outline-offset:2px}
.promo-tag.ro{background:#b794ff;color:#1a0b3d}
.promo-tag{display:inline-block;font-size:11px;font-weight:700;color:#052a20;background:var(--ok);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px;font-style:normal}
.note{font-size:13px;color:var(--wr);margin:8px 0 0}
.step{display:flex;align-items:center;gap:8px}
.step button{width:52px;font-size:22px;flex:none}
.step input{text-align:center;font:700 22px var(--fd)}
.step span{color:var(--mu)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{min-height:36px;padding:4px 12px;border-radius:99px;font-size:13px;background:var(--sf)}
.preview{margin-top:16px;background:linear-gradient(135deg,#1a2a60,#1c1f45);border:1px solid #2e3f86;border-radius:14px;padding:14px}
.preview .pr{font:700 26px var(--fd)}
.preview p{margin:4px 0 0;font-size:13px;color:#c5cdf0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg span{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid var(--ln);background:var(--sf);border-radius:12px;font-weight:600;color:var(--tx);font-size:14px}
.seg input:checked+span{background:var(--ac);border-color:var(--ac);color:#fff}
.bill{background:var(--sf);border-radius:14px;padding:12px 14px;display:grid;gap:6px;font-size:14px}
.bl{display:flex;justify-content:space-between;gap:10px}.bl b{font-variant-numeric:tabular-nums}
.bill .sub{color:var(--mu);font-size:12.5px;margin-top:-4px}
.bill hr{border:0;border-top:1px dashed var(--ln);margin:4px 0;width:100%}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:12px 14px;border-radius:14px;background:#0e2a24;border:1px solid #1f5a4a}
.total b{font:700 28px var(--fd);color:var(--ok);font-variant-numeric:tabular-nums}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.change{display:flex;justify-content:space-between;margin-top:10px;font-size:15px}.change b{font:700 20px var(--fd)}
.check{display:flex!important;gap:10px;align-items:center;color:var(--tx)!important;font-size:14px!important}
.check input{width:22px;min-height:22px;height:22px;flex:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;max-height:46vh;overflow:auto;padding:2px}
.pt{position:relative;flex-direction:column;gap:2px;padding:10px 8px;background:var(--sf);border-radius:14px;text-align:center;min-height:0}
.pt svg{width:48px;height:48px}
.pt b{font-size:13px;font-weight:600;line-height:1.25}
.pt span{font:600 13px var(--fd);color:var(--ac2)}
.pt small{color:var(--mu);font-size:11.5px}
.pt .q{position:absolute;top:6px;right:6px;min-width:24px;height:24px;border-radius:99px;background:var(--ac);color:#fff;font:700 13px/24px var(--fd);padding:0 6px;font-style:normal}
.pt .q:empty{display:none}
.cartv{margin-top:12px;display:grid;gap:6px}
.cr{display:flex;align-items:center;gap:8px;background:var(--sf);border-radius:12px;padding:6px 8px 6px 12px;font-size:14px}
.cr span{flex:1}.cr button{width:36px;min-height:36px;padding:0}
.cr b{font-variant-numeric:tabular-nums;min-width:22px;text-align:center}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pc{display:flex;gap:12px;align-items:center;background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);padding:12px}
.pc .pic{width:64px;height:64px;border-radius:14px;background:var(--sf);display:grid;place-items:center;flex:none}
.pc .pic svg{width:50px;height:50px}
.pc .info{flex:1;min-width:0}
.pc .info b{display:block;overflow-wrap:anywhere}
.pc .price{font:700 16px var(--fd);color:var(--ac2)}
.stk{font-size:12.5px;color:var(--mu)}.pc.lo{border-color:#6b4c16}.pc.lo .stk{color:var(--wr)}
.pc button{flex:none}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--mu);font-weight:600}
th,td{padding:10px 8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
td.n{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.ok{background:#0f3a2f;color:var(--ok)}.pill.no{background:#4a1520;color:var(--er)}
td .row-b{display:flex;gap:6px}td .row-b button{min-height:36px;padding:4px 10px;font-size:13px}
.rf{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.rf>div{flex:1;min-width:140px}.rf label{margin-top:0}
.rf button{flex:none}
.mbar{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar .t{height:10px;background:var(--sf);border-radius:9px;overflow:hidden}.mbar .t i{display:block;height:100%;border-radius:9px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.set{display:grid;gap:12px}
.set .card h3{margin-bottom:4px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.rgrid .ri{display:flex;align-items:center;gap:8px;background:var(--sf);border-radius:12px;padding:8px}
.rgrid .ri svg{width:54px;flex:none}.rgrid .ri div{flex:1}.rgrid label{margin:0 0 4px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
.lrow:last-of-type{border-bottom:0}.lrow svg.cart{width:52px;flex:none}.lrow span{flex:1;min-width:0;overflow-wrap:anywhere}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.login{max-width:440px;margin:24px auto 0;text-align:center}
.pub{max-width:960px;margin:8px auto 26px}
.pubh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pubh h2{font-size:26px}
.stale{color:var(--wr)}
.ptypes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.ptype{display:flex;align-items:center;gap:10px;background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:10px 12px}
.ptype svg{width:52px;flex:none}.ptype span{white-space:nowrap}.ptype b{display:block;font:700 16px var(--fd)}.ptype span{font-size:13px;color:var(--mu)}.ptype span em{font-style:normal;color:var(--ok);font-weight:600}
.pgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.uc{border-radius:12px;padding:8px 10px;border:1px solid var(--ln);background:var(--cd);display:flex;flex-direction:column;gap:1px}
.uc b{font:700 18px/1.1 var(--fd)}.uc small{color:var(--mu);font-size:11.5px}.uc i{font-style:normal;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:4px}
.uc.free{border-color:#1f5a4a;background:#0e2a24}.uc.free i{color:var(--ok)}
.uc.busy{border-color:#2d4ea8;background:#141f47}.uc.busy i{color:var(--ac2)}
.uc.maint{opacity:.6}.uc.maint i{color:var(--mu)}
.book{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;padding:12px 16px;border-radius:14px;background:#0e2a24;border:1px solid #1f5a4a;color:#cdeee4;font-size:15px;text-align:left}
.book svg{color:#25d366;flex:none}.book a{color:#fff;text-decoration:none;border-bottom:1px dashed #25d366}.book a:hover{color:#25d366}
.divider{display:flex;align-items:center;gap:12px;max-width:440px;margin:0 auto 4px;color:var(--mu);font-size:13px}.divider::before,.divider::after{content:"";flex:1;border-top:1px solid var(--ln)}
.lart{display:flex;justify-content:center;align-items:flex-end;margin-bottom:6px}
.lart svg{width:120px}.lart svg:nth-child(1){transform:rotate(-12deg) translateX(14px)}.lart svg:nth-child(3){transform:rotate(12deg) translateX(-14px)}.lart svg:nth-child(2){width:140px;position:relative;z-index:1}
.login h2{font-size:28px}.login>p{color:var(--mu);margin:4px 0 16px}
.login .card{text-align:left}
.err{color:var(--er);font-size:13px;margin:8px 0 0}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);font-weight:600;padding:12px 18px;border-radius:12px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 10px 30px #0008}
@media (min-width:821px){#toast{bottom:24px}}
#rc{font:12px/1.4 ui-monospace,Menlo,monospace;background:#fff;color:#000;padding:12px;margin:auto;width:80mm;max-width:100%;border-radius:4px}
#rc.w58{width:58mm}#rc hr{border:0;border-top:1px dashed #000}#rc .r{display:flex;justify-content:space-between;gap:6px}
@media print{body{background:#fff}body>*:not(#m){display:none!important}#m{position:static;background:none;padding:0;display:block!important;backdrop-filter:none}.sheet{border:0;background:none;padding:0;margin:0;max-width:none}.np,.x{display:none!important}#rc{border-radius:0}}
/* pengeluaran & grafik */
.xform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}.xform .wide{grid-column:1/-1}
@media (max-width:640px){.xform{grid-template-columns:1fr}}
.xday{padding:10px 0;border-bottom:1px solid var(--ln)}.xday:last-of-type{border-bottom:0}
.xrow{display:flex;align-items:center;gap:10px;padding:6px 0 0}
.xcat{flex:none;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:#3a2a0f;color:#f0c27a;border:1px solid #6b4c16}
.xnote{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}.xnote small{display:block;color:var(--mu);font-size:12px}
.xrow button{min-height:36px;width:40px;padding:0;flex:none}
.ccard{margin-bottom:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mu)}

 <div class="bill-est"><span>Estimasi tagihan</span><b>${rp(rent(s,t)+prodSum(s))}</b></div>`}

const mdVal=()=>(document.querySelector('input[name=md]:checked')||{}).value||'r';
const bkVal=()=>(document.querySelector('input[name=bk]:checked')||{}).value==='simpan';
const hp=v=>{let d=String(v||'').replace(/\D/g,'');if(d.startsWith('62'))d='0'+d.slice(2);return d.length>=9?d:''};
const jm=m=>{m=Math.round(m||0);const h=m/60|0,r=m%60;return h&&r?`${h} jam ${r} menit`:h?`${h} jam`:`${r} menit`};
const BDAYS=5,WIB=7*36e5;
// Bonus berlaku sampai akhir hari kerja ke-5 setelah hari disimpan (WIB, Sabtu–Minggu tidak dihitung).
function expOf(at){let d=Math.floor((at+WIB)/864e5)*864e5-WIB,n=0;while(n<BDAYS){d+=864e5;const w=new Date(d+WIB).getUTCDay();if(w>0&&w<6)n++}return d+864e5-1}
const live=(ls,now=Date.now())=>(ls||[]).filter(l=>l.min>0&&expOf(l.at)>now);
const lots=p=>live(S.members[p]&&S.members[p].lots);
const sumL=ls=>ls.reduce((a,l)=>a+l.min,0);
const bal=p=>sumL(lots(p)),balToday=p=>sumL(lots(p).filter(l=>day(l.at)===day(Date.now())));
function takeLots(ls,need,now,today){const all=live(ls,now).map(l=>({...l})).sort((a,b)=>a.at-b.at);let r=need,first=null;
 for(const l of all){if(!r)break;if(today&&day(l.at)!==day(now))continue;const x=Math.min(l.min,r);if(x){l.min-=x;r-=x;if(first===null)first=l.at}}
 return r>0?null:{rest:all.filter(l=>l.min>0),first}}
function startM(id){const u=S.units.find(x=>x.id===id),c=cfg(),we=wkend(Date.now());
 const ops=[['r','Paket jam','Bayar per jam, pilih durasinya',0],...Object.entries(c.promos).filter(([,p])=>p.on).map(([k,p])=>[k,p.name,`Bayar ${p.pay} jam, bonus ${p.bonus} jam · ${rp(rate(u)*p.pay)}`,1]),...(RO().on&&u.type===RO().type?RO().opts.map((o,i)=>['o'+i,'Rent Out '+o.h+' jam',`Sewa bawa pulang ${o.h} jam · ${rp(o.price)}`,3]):[]),['b','Main bebas','Bayar sesuai lama main, dihitung saat checkout',0],['z','Ambil bonus saja','Bonus yang disimpan hari ini, tanpa bayar jam',2]];
 open(`<div class="mhead">${padArt(u.type)}<div><h3>Mulai Rental</h3><div class="mu">${esc(u.name)} · ${esc(u.type)} · ${rp(rate(u))}/jam</div></div></div>
 <div class="two" style="margin-top:0"><div><label for="cu">Nama pelanggan</label><input id="cu" placeholder="Contoh: Budi"></div><div><label for="cp">No. HP (untuk bonus)</label><input id="cp" type="tel" inputmode="tel" placeholder="08xxxxxxxxxx" oninput="custHp('${id}')"></div></div>

 <div id="hw"><label for="hr">Durasi</label><div class="step"><button type="button" aria-label="Kurangi" onclick="stepH('hr',-1,'${id}')">−</button><input id="hr" type="number" min="1" max="24" value="1" inputmode="numeric" oninput="pv('${id}')"><span>jam</span><button type="button" aria-label="Tambah" onclick="stepH('hr',1,'${id}')">+</button></div>

function custHp(id){const p=hp($('#cp').value),m=p&&S.members[p],b=bal(p),bt=balToday(p);

function plan(u,md,hr,keep,rd){const c=cfg(),r=rate(u);
 if(md==='b')return{mode:'bebas',label:'Main bebas',paidMin:0,bonusMin:0,earnMin:0,keep:false,redeemMin:0,price:0};
 if(/^o\d$/.test(md)){const o=RO().opts[+md.slice(1)];return{mode:'paket',label:'Rent Out '+o.h+' jam',paidMin:o.h*60,bonusMin:0,earnMin:0,keep:false,redeemMin:0,rentOut:true,price:o.price}}
 if(md==='z')return{mode:'paket',label:'Ambil bonus simpanan',paidMin:0,bonusMin:0,earnMin:0,keep:false,redeemMin:rd||0,sameDay:true,price:0};

 ${Object.keys(byDay).length?Object.entries(byDay).map(([d,xs])=>`<div class="xday"><div class="bl"><b>${fmtD(d)}</b><b class="num">${rp(sumA(xs))}</b></div>${xs.map(x=>`<div class="xrow"><span class="xcat">${esc(x.cat)}</span><span class="xnote">${esc(x.note||'')}<small>${esc(S.names[x.by]||'')}</small></span><b class="num">${rp(x.amount)}</b>${canEditExp(x)?`<button aria-label="Ubah pengeluaran" onclick="expM('${x.id}')">${IC.edit}</button>`:''}</div>`).join('')}</div>`).join(''):empty('Belum ada pengeluaran di bulan ini.',`<svg viewBox="0 0 24 24" style="width:64px" fill="none" stroke="currentColor" stroke-width="1.4">${IC.Pengeluaran.replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg>`)}

async function addExp(){const d=$('#xd').value,c=$('#xc').value.trim(),a=Math.round(+$('#xa').value||0),n=$('#xn').value.trim(),er=$('#xerr');er.textContent='';

const RT={key:'',list:[],busy:false,err:''};
function repStart(){return[rf.from,day(Date.now()-29*864e5)].sort()[0]}
async function repLoad(){const k=repStart();if(RT.key===k||RT.busy)return;RT.busy=true;RT.err='';
 try{const q=await db.collection('trx').where('at','>=',Date.parse(k+'T00:00:00+07:00')).get();RT.list=q.docs.map(d=>({id:d.id,...d.data()}));RT.key=k}catch(e){RT.err=e.message||String(e)}RT.busy=false;if(tab==='Laporan'&&$('#m').style.display!=='flex')render()}
function repTrx(){const m=new Map();RT.list.forEach(x=>m.set(x.id,x));S.trx.forEach(x=>m.set(x.id,x));return[...m.values()]}

/* ---------- grafik 30 hari: pendapatan vs pengeluaran ---------- */
const CI='#5a8ff0',CO='#c97d24';
function niceMax(v){if(v<=0)return 100000;const e=Math.pow(10,Math.floor(Math.log10(v/4))),f=[1,2,2.5,5,10].find(f=>f*e*4>=v)||10;return f*e*4}
function chartData(){const D=864e5,days=[];for(let i=29;i>=0;i--)days.push(day(Date.now()-i*D));const inc={},out={};days.forEach(d=>{inc[d]=0;out[d]=0});
 repTrx().forEach(x=>{if(S.voids[x.id])return;const d=day(x.at);if(d in inc)inc[d]+=x.total||0});S.exp.forEach(x=>{if(x.date in out)out[x.date]+=+x.amount||0});
 return days.map(d=>({d,i:inc[d],o:out[d]}))}
function chartSvg(rows){const W=900,H=280,L=58,R=10,T=14,B=30,cw=W-L-R,ch=H-T-B,n=rows.length,gw=cw/n,bw=Math.max(3,Math.min(11,(gw-6)/2)),mx=niceMax(Math.max(...rows.map(r=>Math.max(r.i,r.o))));
 const y=v=>T+ch-(v/mx)*ch,bar=(x,v,c)=>{if(v<=0)return'';const top=y(v),h=T+ch-top,r=Math.min(4,bw/2,h);return `<path d="M${x} ${T+ch}V${top+r}Q${x} ${top} ${x+r} ${top}H${x+bw-r}Q${x+bw} ${top} ${x+bw} ${top+r}V${T+ch}Z" fill="${c}"/>`};
 const ticks=[0,.25,.5,.75,1].map(f=>f*mx),dm=d=>+d.slice(8)+'/'+ +d.slice(5,7);
 return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Grafik batang pendapatan dan pengeluaran per hari, 30 hari terakhir">
 ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v?'#ffffff12':'#ffffff33'}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="ax">${v?rpS(v):'0'}</text>`).join('')}
 ${rows.map((r,k)=>{const x0=L+k*gw,cx=x0+gw/2;return `<g>${bar(cx-bw-1,r.i,CI)}${bar(cx+1,r.o,CO)}${k%5===0||k===n-1?`<text x="${cx}" y="${H-10}" text-anchor="middle" class="ax">${dm(r.d)}</text>`:''}<rect class="hit" data-k="${k}" x="${x0}" y="${T}" width="${gw}" height="${ch}" fill="transparent"/></g>`}).join('')}</svg>`}

/* ---------- halaman depan: promo, kontak, animasi ---------- */
const DEFPK=[{name:'PAKET MAIN 2 JAM',play:2,bonus:1,badge:'',btn:'Pilih Paket 2 + 1 Jam',msg:'Halo B4 Game Station, saya tertarik promo Oktober main 2 jam bonus 1 jam, total 3 jam. Apakah tersedia?'},
 {name:'PAKET MAIN 5 JAM',play:5,bonus:3,badge:'Bonus Lebih Banyak',btn:'Pilih Paket 5 + 3 Jam',msg:'Halo B4 Game Station, saya tertarik promo Oktober main 5 jam bonus 3 jam, total 8 jam. Apakah tersedia?'}];
// Konfigurasi halaman depan (public/site). Nomor WA bawaan = nomor booking yang sudah dipakai situs.
function site(){const d=S.site||{},P=d.promo||{};return{wa:d.wa===undefined?'6281357976335':d.wa,url:d.url||'',
 promo:{on:P.on!==false,title:P.title||'PROMO BULAN OKTOBER',sub:P.sub||'Main Lebih Lama, Makin Seru!',desc:P.desc||'Nikmati bonus waktu bermain di B4 Game Station. Pilih paketmu dan ajak teman main bareng!',
  year:P.year||'',start:P.start||'',end:P.end||'',after:P.after||'label',terms:P.terms||'',pk:(P.pk&&P.pk.length?P.pk:DEFPK)}}}
const waNorm=v=>{let d=String(v||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return d};
const waFmt=v=>{const d=waNorm(v).replace(/^62/,'0');return d.replace(/^(\d{4})(\d{4})(\d+)$/,'$1-$2-$3')};
function waHref(msg){const c=site();if(c.url)return c.url;if(!c.wa)return'';return'https://wa.me/'+waNorm(c.wa)+(msg?'?text='+encodeURIComponent(msg):'')}
// Status periode promo berdasarkan tanggal di Asia/Jakarta. Tanpa tanggal = selalu aktif, tanpa hitung mundur.
function promoState(p){const t=day(Date.now());if(p.start&&t<p.start)return'soon';if(p.end&&t>p.end)return'ended';return'open'}
const tglID=d=>new Intl.DateTimeFormat('id-ID',{timeZone:'UTC',day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T00:00:00Z'));
let landSeen=false,landObs=null;
function promoRender(){const e=$('#promo');if(!e)return;const c=site(),p=c.promo,st=promoState(p);promoRender.st=st;
 const show=p.on&&!(st==='ended'&&p.after==='hide');e.hidden=!show;const nl=document.querySelector('#nav a[href="#promo"]');if(nl)nl.hidden=!show;if(!show){e.innerHTML='';return}
 const period=p.start||p.end?`${p.start?tglID(p.start):''}${p.start&&p.end?' – ':''}${p.end?(p.start?'':'s/d ')+tglID(p.end):''}`:'';
 const lab=st==='soon'?`<span class="pstat soon">${IC.clock}Segera Hadir${p.start?' · mulai '+tglID(p.start):''}</span>`:st==='ended'?`<span class="pstat ended">Promo Berakhir</span>`:period?`<span class="pstat">${IC.clock}Berlaku ${period}</span>`:'';
 const canBook=st==='open'&&!!waHref(),terms=String(p.terms||'').split('\n').map(x=>x.trim()).filter(Boolean),inC=landSeen?' in':'';
 const shape=(k,cls,style)=>`<svg class="floaty ${cls}" style="${style}" viewBox="0 0 20 20" aria-hidden="true">${{tri:'<path d="M10 2l8 14H2z" fill="none" stroke="#3ec7a4" stroke-width="2" stroke-linejoin="round"/>',cir:'<circle cx="10" cy="10" r="7.5" fill="none" stroke="#ff5a6e" stroke-width="2"/>',x:'<path d="M3 3l14 14M17 3L3 17" stroke="#6fa8ff" stroke-width="2.4" stroke-linecap="round"/>',sq:'<rect x="3" y="3" width="14" height="14" fill="none" stroke="#e28fd4" stroke-width="2.2"/>'}[k]}</svg>`;
 e.innerHTML=`<div class="pwrap ${landSeen?'pin':''}">${shape('tri','f1','left:-18px;top:30%;width:110px')}${shape('cir','f2','right:6%;top:-24px;width:90px')}${shape('x','f3','left:38%;bottom:-20px;width:70px')}${shape('sq','f4','right:-14px;bottom:26%;width:80px')}
 <svg class="floaty f2" style="left:52%;top:10%;width:150px;opacity:.08" viewBox="0 0 160 100" aria-hidden="true"><path d="M46 16h68c17 0 27 11 31 30l7 32c3 14-10 22-20 14L116 78H44L28 92c-10 8-23 0-20-14l7-32c4-19 14-30 31-30z" fill="#b794ff"/></svg>
 <div class="phead"><div><span class="kick rv${inC}">B4 Game Station</span><h2 class="rv d1${inC}">${esc(p.title)}${p.year?' '+esc(p.year):''}</h2><h3 class="rv d1${inC}">${esc(p.sub)}</h3><p class="rv d2${inC}">${esc(p.desc)}</p>${lab?`<div class="rv d2${inC}">${lab}</div>`:''}</div><img class="rv${inC}" src="logo.png" alt="B4 Game Station" width="190" height="190"></div>
 <div class="pcz">${p.pk.map((k,i)=>{const pl=+k.play||0,bn=+k.bonus||0,tot=pl+bn,href=waHref(k.msg);return `<article class="pk rv d${i+2}${inC} ${k.badge?'hot':''}" aria-label="${esc(k.name)}">${k.badge?`<span class="rib">${esc(k.badge)}</span>`:''}<div class="nm">${esc(k.name)}</div>
  <div class="eq" role="img" aria-label="Main ${pl} jam ditambah bonus ${bn} jam sama dengan total ${tot} jam"><div class="blk play"><b>${pl}<small>JAM</small></b><span>Main</span></div><i aria-hidden="true">+</i><div class="blk bonus"><b>${bn}<small>JAM</small></b><span>Bonus</span></div><i aria-hidden="true">=</i><div class="blk total"><b>${tot}<small>JAM</small></b><span>Total main</span></div></div>
  <p class="sum2">Main <b>${pl} jam</b>, bonus <b>${bn} jam</b>, total waktu bermain <b>${tot} jam</b>.</p>
  ${canBook?`<a class="bk" href="${esc(href)}" target="_blank" rel="noopener">${IC.wa}${esc(k.btn)}</a>`:`<a class="bk" aria-disabled="true" role="link" tabindex="-1">${st==='soon'?'Segera Hadir':st==='ended'?'Promo Berakhir':'Kontak booking belum diatur'}</a>`}</article>`}).join('')}</div>
 ${terms.length?`<div class="pterms rv d3${inC}"><b>Ketentuan</b><ul>${terms.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}</div>`;
 landWatch()}
function footRender(){const e=$('#kontak');if(!e)return;const c=site(),h=waHref(),y=new Intl.DateTimeFormat('en',{timeZone:TZ,year:'numeric'}).format(Date.now());
 e.innerHTML=`<div class="foot2 rv${landSeen?' in':''}"><img src="logo.png" alt="B4 Game Station" width="92" height="92" loading="lazy"><div><h3>B4 GAME STATION</h3><p>${h?`Booking &amp; info: <a class="wa" href="${esc(h)}" target="_blank" rel="noopener">${c.url?'Halaman booking':'WhatsApp '+waFmt(c.wa)}</a>`:'Kontak booking belum diatur.'}</p></div>
 <div class="flinks" role="navigation" aria-label="Tautan halaman">${site().promo.on?'<a href="#promo">Promo</a>':''}<a href="#status">Status Unit</a><a href="#masuk">Masuk Staf</a></div></div><p class="copy">© ${y} B4 GAME STATION</p>`;
 const f=$('#fab');if(h){f.href=h;f.innerHTML=IC.wa;f.hidden=!document.body.classList.contains('pubmode')}else f.hidden=true;fabWatch();landWatch()}
// Tombol WA mengambang disembunyikan saat tombol booking lain terlihat, supaya tidak menutupi tombol atau konten.
function fabWatch(){if(!('IntersectionObserver' in window))return;const vis=fabWatch.v=fabWatch.v||new Set();if(fabWatch.o)fabWatch.o.disconnect();vis.clear();
 fabWatch.o=new IntersectionObserver(es=>{es.forEach(x=>x.isIntersecting?vis.add(x.target):vis.delete(x.target));$('#fab').classList.toggle('away',vis.size>0)});
 document.querySelectorAll('.pk,.book,#kontak,#masuk .card').forEach(x=>fabWatch.o.observe(x))}
function pubHeader(){const h=waHref(),act=($('#nav a.on')||{}).getAttribute?.('href')||'#promo',show=site().promo.on;
 $('#nav').innerHTML=[['#promo','Promo'],['#status','Status Unit'],['#kontak','Kontak'],['#masuk','Masuk Staf']].filter(([k])=>k!=='#promo'||show).map(([k,l])=>`<a href="${k}"${k===act?' class="on" aria-current="true"':''}>${l}</a>`).join('');
 $('#who').innerHTML=h?`<a class="bkh" href="${esc(h)}" target="_blank" rel="noopener">${IC.wa}<span>Booking</span></a>`:''}
function landInit(){pubHeader();promoRender();pubRender();footRender();
 const red=matchMedia('(prefers-reduced-motion: reduce)').matches;document.body.classList.toggle('anim',!red&&'IntersectionObserver' in window);
 if(red)landSeen=true;
 // penanda navigasi aktif
 if(landInit.nav)landInit.nav.disconnect();if('IntersectionObserver' in window){landInit.nav=new IntersectionObserver(es=>{es.forEach(x=>{if(x.isIntersecting){document.querySelectorAll('#nav a').forEach(a=>{const on=a.getAttribute('href')==='#'+x.target.id;a.classList.toggle('on',on);on?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current')})}})},{rootMargin:'-45% 0px -50% 0px'});
  document.querySelectorAll('.land .psec').forEach(x=>landInit.nav.observe(x))}
 setTimeout(()=>{document.querySelectorAll('.rv').forEach(x=>x.classList.add('in'));landSeen=true},1600)}
function landWatch(){if(!('IntersectionObserver' in window)){document.querySelectorAll('.rv').forEach(x=>x.classList.add('in'));return}
 if(!landObs)landObs=new IntersectionObserver(es=>es.forEach(x=>{const t=x.target;
  if(t.classList.contains('pwrap')){t.classList.toggle('paused',!x.isIntersecting);if(x.isIntersecting)t.classList.add('pin')}
  else if(x.isIntersecting){t.classList.add('in');landObs.unobserve(t)}}),{threshold:.12});
 document.querySelectorAll('.rv:not(.in),.pwrap').forEach(x=>landObs.observe(x))}
const hero=()=>`<img class="plogo" src="logo.png" alt="B4 Game Station">`;
function vLogin(){if($('#le')||$('#fn'))return;const a=$('#app');
 if(!S.setupKnown){a.innerHTML='<p class="mu">Memuat…</p>';return}
 if(!S.setup){a.innerHTML=`<div class="login">${hero()}<h2>Selamat datang!</h2><p>Buat akun Admin untuk pemilik. Kasir ditambahkan nanti di Pengaturan.</p><div class="card"><label for="fn" style="margin-top:0">Nama</label><input id="fn" placeholder="Nama pemilik" autocomplete="name"><label for="fe">Email</label><input id="fe" type="email" placeholder="nama@gmail.com" autocomplete="email"><label for="f1">Kata sandi (min. 6 karakter)</label><input id="f1" type="password" autocomplete="new-password"><label for="f2">Ulangi kata sandi</label><input id="f2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')firstAdmin()"><p class="err" id="lerr" role="alert"></p><button class="p" id="lb" style="width:100%;margin-top:12px" onclick="firstAdmin()">Buat akun Admin</button></div></div>`;return}
 a.innerHTML=`<div class="land"><section id="promo" class="psec" aria-label="Promo"></section><section id="status" class="psec" aria-label="Status unit"><div id="pubst"></div></section><section id="masuk" class="psec" aria-label="Masuk staf"><div class="divider">Khusus staf</div><div class="login" style="margin-top:10px"><h2>Masuk</h2><p>Masuk dengan email dan kata sandi akun staf.</p><div class="card"><label for="le" style="margin-top:0">Email</label><input id="le" type="email" autocomplete="username" placeholder="nama@gmail.com"><label for="lp">Kata sandi</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><p class="err" id="lerr" role="alert"></p><button class="p" id="lb" style="width:100%;margin-top:12px" onclick="login()">Masuk</button><div style="text-align:center;margin-top:8px"><button class="link" onclick="resetPw()">Lupa kata sandi?</button></div></div></div></section><footer id="kontak" class="psec"></footer></div>`;landInit()}
function vNoAccess(){const a=$('#app');if(!S.meReady){a.innerHTML='<p class="mu">Memeriksa akun…</p>';return}
 a.innerHTML=`<div class="login">${hero()}<h2>Akun belum terdaftar</h2><p>${esc(authUser.email)} belum terdaftar sebagai staf aktif. Minta Admin menambahkan email ini di Pengaturan → Akun staf.</p><button onclick="logout()">Keluar</button></div>`}
const nAdm=ex=>S.users.filter(x=>x.role==='admin'&&x.on!==false&&x.id!==ex).length;
function userM(id){const u=S.users.find(x=>x.id===id)||{name:'',email:'',role:'kasir',on:true};
 open(`<h3>${id?'Ubah':'Tambah'} Staf</h3><label for="nn">Nama</label><input id="nn" value="${esc(u.name)}">
 ${id?`<label>Email</label><div class="mu" style="font-size:15px">${esc(u.email)}</div>`:`<label for="ne">Email</label><input id="ne" type="email" placeholder="kasir@gmail.com"><label for="np">Kata sandi awal (min. 6 karakter)</label><input id="np" type="text" autocomplete="off"><p class="mu" style="margin:6px 0 0">Berikan kata sandi ini ke staf. Mereka bisa menggantinya lewat "Lupa kata sandi?".</p>`}
 <label>Peran</label><div class="seg" style="grid-template-columns:1fr 1fr"><label><input type="radio" name="nr" value="kasir" ${u.role!=='admin'?'checked':''}><span>Kasir</span></label><label><input type="radio" name="nr" value="admin" ${u.role==='admin'?'checked':''}><span>Admin</span></label></div>
 <label class="check" style="margin-top:14px"><input id="na" type="checkbox" ${u.on!==false?'checked':''}>Akun aktif</label>
 ${id&&u.email?`<button class="link" style="margin-top:8px" onclick="sendReset('${esc(u.email)}')">Kirim email ganti kata sandi</button>`:''}
 <p class="err" id="uerr" role="alert"></p>
 <div class="foot">${id&&id!==me?`<button class="d" onclick="delUser('${id}')">Hapus</button>`:`<button onclick="close()">Batal</button>`}<button class="p" id="ub" onclick="saveUser('${id||''}')">Simpan</button></div>`)}
async function sendReset(e){try{await auth.sendPasswordResetEmail(e);toast('Email ganti kata sandi dikirim ke '+e)}catch(x){toast(aErr(x))}}
async function saveUser(id){const n=$('#nn').value.trim(),r=(document.querySelector('input[name=nr]:checked')||{}).value||'kasir',on=$('#na').checked,o=S.users.find(x=>x.id===id)||{},er=$('#uerr');er.textContent='';
 if(!n)return er.textContent='Isi nama.';
 if(o.role==='admin'&&(r!=='admin'||!on)&&!nAdm(id))return er.textContent='Harus ada minimal satu Admin aktif.';
 $('#ub').disabled=true;
 try{if(id){await db.doc('users/'+id).update({name:n,role:r,on})}
  else{const e=$('#ne').value.trim(),p=$('#np').value;if(p.length<6)throw{code:'auth/weak-password'};
   const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(fbCfg,'sec');const c=await sec.auth().createUserWithEmailAndPassword(e,p);await sec.auth().signOut();
   await db.doc('users/'+c.user.uid).set({name:n,email:e,role:r,on})}
  close();toast('Akun staf disimpan')}catch(x){er.textContent=x.code&&x.code.startsWith('auth/')?aErr(x):(x.code==='permission-denied'?'Tidak punya izin.':x.message||String(x));$('#ub').disabled=false}}
async function delUser(id){const o=S.users.find(x=>x.id===id);if(o.role==='admin'&&!nAdm(id))return toast('Harus ada minimal satu Admin aktif');try{await db.doc('users/'+id).delete();close();toast('Akses staf dicabut')}catch(e){dbErr(e)}}

/* ---------- data ---------- */
function subAll(){
 const sub=(p,f)=>unData.push(db.collection(p).onSnapshot(s=>{f(s.docs.map(d=>({id:d.id,...d.data()})));render()},dbErr));
 unData.push(db.doc('settings/main').onSnapshot(s=>{S.cfg=s.exists?s.data():null;S.cfgReady=true;render()},dbErr));
 unData.push(db.doc('meta/legacy').onSnapshot(s=>{S.legacy=s.exists&&s.data().names||{};names();render()},()=>{}));
 sub('users',l=>{S.users=l;names()});sub('units',l=>S.units=l.sort((a,b)=>(a.ord||0)-(b.ord||0)));sub('products',l=>S.prods=l);sub('stock',l=>{S.stock={};l.forEach(x=>S.stock[x.id]=x.qty)});
 sub('expenses',l=>{S.exp=l});sub('members',l=>{S.members={};l.forEach(x=>S.members[x.id]=x)});sub('active',l=>{S.act={};l.forEach(x=>S.act[x.id]=x)});sub('voids',l=>{S.voids={};l.forEach(x=>S.voids[x.id]=x)});
 unData.push(db.collection('trx').orderBy('at','desc').limit(1000).onSnapshot(s=>{S.trx=s.docs.map(d=>({id:d.id,...d.data()}));render()},dbErr));
}
function names(){S.names={...S.legacy};S.users.forEach(u=>S.names[u.id]=u.name)}

/* ---------- boot ---------- */
(async()=>{
 try{fbCfg=await (await fetch('/__/firebase/init.json')).json();firebase.initializeApp(fbCfg)}
 catch(e){$('#app').innerHTML='<div class="card">Konfigurasi Firebase tidak ditemukan. Halaman ini harus dibuka dari Firebase Hosting (alamat .web.app).</div>';return}
 auth=firebase.auth();db=firebase.firestore();
 db.doc('public/status').onSnapshot(s=>{S.pub=s.exists?s.data():null;pubRender()},()=>{});
 db.doc('public/site').onSnapshot(s=>{S.site=s.exists?s.data():null;if($('#promo')){pubHeader();promoRender();footRender();pubRender()}},()=>{});
 db.doc('meta/setup').onSnapshot(s=>{S.setup=s.exists;S.setupKnown=true;if(!authUser)render()},()=>{S.setupKnown=true;S.setup=true;render()});
 auth.onAuthStateChanged(u=>{authUser=u;if(unMe){unMe();unMe=null}unData.forEach(f=>f());unData=[];cur=null;admin=false;me='';S.meReady=false;S.cfgReady=false;tab='Dashboard';
  if(!u){render();return}
  me=u.uid;idle=Date.now();render();
  unMe=db.doc('users/'+u.uid).onSnapshot(s=>{S.meReady=true;const d=s.exists?{id:s.id,...s.data()}:null,was=!!cur;
   if(d&&d.on!==false){cur=d;admin=d.role==='admin';if(!was)subAll()}else{cur=null;admin=false;if(was){unData.forEach(f=>f());unData=[]}}render()},()=>{S.meReady=true;render()});
 });
 ['pointerdown','keydown'].forEach(e=>document.addEventListener(e,()=>idle=Date.now()));setInterval(tick,1000);document.addEventListener('click',()=>ctx.resume&&ctx.resume(),{once:true});
})();
</script></body></html>
