function coCalc(){const {r,pr}=window._co,d=Math.min(+$('#ds').value||0,r+pr),tt=r+pr-d,m=meVal();$('#tt').textContent=rp(tt);
 $('#cw').hidden=m!=='Tunai';$('#nw').hidden=m==='Tunai';
 const q=[tt,...[5e3,1e4,2e4,5e4,1e5].map(n=>Math.ceil(tt/n)*n)].filter((v,i,a)=>v>0&&a.indexOf(v)===i).sort((a,b)=>a-b).slice(0,4);
 if(coCalc.k!==tt){coCalc.k=tt;$('#qk').innerHTML=q.map((v,i)=>`<button type="button" class="chip" onclick="$('#ca').value=${v};coCalc()">${i?rp(v):'Uang pas'}</button>`).join('')}

 const phone=s.phone||(bo.save&&$('#bp')?hp($('#bp').value):'');
 if(bo.save&&!phone)return er.textContent='Isi No. HP yang valid supaya bonus '+jm(bo.save)+' tersimpan.';
 busy=true;$('#pb').disabled=true;
 try{const d=Math.min(+$('#ds').value||0,r+pr),tt=r+pr-d,m=meVal(),ca=+$('#ca').value||0,id='T'+s.start+(s.unit?'-'+s.unit:''),now=Date.now();
  if(S.trx.some(x=>x.id===id))throw{message:'Transaksi ini sudah tercatat.'};
  if(s.mode==='jual'){for(const i of s.items)if((S.stock[i.pid]??0)<i.q)throw{message:'Stok '+i.n+' tidak cukup.'};for(const i of s.items)await takeStock({id:i.pid,name:i.n},i.q)}
  const t={id,no:'B4-'+day(s.start).replace(/-/g,'')+'-'+String(s.start).slice(-6),at:now,unit:s.unit||'',unitName:s.unitName||'',type:s.type||'',cust:s.cust||'',phone,mode:s.mode,label:s.label,paidMin:s.paidMin||0,bonusMin:s.bonusMin||0,redeemMin:s.redeemMin||0,savedMin:bo.save,lostMin:bo.lost,promo:s.promo||'',extMin:(s.ext||[]).reduce((a,e)=>a+e.min,0),usedMin:s.mode==='bebas'?Math.max(s.round||1,Math.ceil((now-s.start)/6e4/(s.round||1))*(s.round||1)):0,startAt:s.start,rental:r,prod:pr,disc:d,total:tt,method:m,ref:m==='Tunai'?'':($('#rf').value||''),cash:m==='Tunai'?ca:0,change:m==='Tunai'?ca-tt:0,items:s.items||[],by:me};
  const tref=db.doc('trx/'+id),mref=phone?db.doc('members/'+phone):null;
  await db.runTransaction(async tx=>{if((await tx.get(tref)).exists)throw{message:'Transaksi ini sudah tercatat.'};
   let b=null;if(mref&&bo.save){const md=await tx.get(mref),d0=md.exists?md.data():{},ls=live(d0.lots,now);
    if(bo.earn)ls.push({min:bo.earn,at:now});if(bo.back)ls.push({min:bo.back,at:s.redeemAt||now});b=sumL(live(ls,now));
    tx.set(mref,{name:s.cust||d0.name||'',phone,lots:live(ls,now),bonusMin:b,at:now},{merge:true});
    tx.set(db.collection('bonuslog').doc(),{phone,min:bo.save,type:'simpan',unit:s.unitName||'',trx:id,at:now,by:me});t.expAt=now+BEXP}
   if(b!==null)t.balAfter=b;
   tx.set(tref,t);if(s.unit)tx.delete(db.doc('active/'+s.unit))});
  busy=false;close();receipt(t);toast('Pembayaran berhasil')}catch(e){dbErr(e);busy=false;if($('#pb'))coCalc()}busy=false}

function repData(){const l=S.trx.filter(x=>{const d=day(x.at);return d>=rf.from&&d<=rf.to&&!S.voids[x.id]});const o={l,bs:0,bu:0,bl:0,rent:0,prod:0,disc:0,tot:0,m:{},u:{},p:{},n:S.trx.filter(x=>{const d=day(x.at);return d>=rf.from&&d<=rf.to&&S.voids[x.id]}).reduce((a,x)=>[a[0]+1,a[1]+x.total],[0,0])};
 for(const x of l){o.bs+=x.savedMin||0;o.bu+=x.redeemMin||0;o.bl+=x.lostMin||0;o.rent+=x.rental;o.prod+=x.prod;o.disc+=x.disc;o.tot+=x.total;o.m[x.method]=(o.m[x.method]||0)+x.total;

async function saveUnit(id){try{id=id||'u'+Date.now();await db.doc('units/'+id).set({name:$('#un').value.trim()||id,type:(document.querySelector('input[name=ut]:checked')||{}).value||'PS4',rate:Math.max(0,+$('#ur').value||0),maint:$('#um').checked,ord:S.units.find(x=>x.id===id)?.ord??Date.now()});close();toast('Unit disimpan')}catch(e){dbErr(e)}}
async function delUnit(id){if(S.act[id])return toast('Unit masih punya sesi aktif');try{await db.doc('units/'+id).delete();close()}catch(e){dbErr(e)}}
async function seed(){try{const b=db.batch();b.set(db.doc('settings/main'),DEF);for(let i=1;i<=16;i++)b.set(db.doc('units/u'+String(i).padStart(2,'0')),{name:'Unit '+String(i).padStart(2,'0'),type:'PS4',rate:0,maint:false,ord:i});await b.commit();toast('Data awal siap. Atur jenis konsol tiap unit di Pengaturan.')}catch(e){dbErr(e)}}
async function importData(){const f=$('#imf')&&$('#imf').files[0];if(!f)return toast('Pilih file .json dulu');if(busy)return;busy=true;
 try{const j=JSON.parse(await f.text()),C=j.collections;if(!C)throw{message:'File ini bukan hasil ekspor B4.'};const ops=[];
  for(const [c,docs] of Object.entries(C)){if(c==='users'){ops.push(['meta','legacy',{names:Object.fromEntries(Object.entries(docs).map(([k,v])=>[k,v.name]))}]);continue}
   if(!['settings','units','products','stock','active','trx','voids'].includes(c))continue;for(const [id,d] of Object.entries(docs))ops.push([c,id,d])}
  for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(([c,id,d])=>b.set(db.doc(c+'/'+id),d));await b.commit()}
  toast(ops.length+' data berhasil diimpor');const e=$('#imf');if(e)e.value=''}catch(e){dbErr(e)}busy=false}

/* ---------- akun ---------- */
async function login(){const e=$('#le').value.trim(),p=$('#lp').value,er=$('#lerr');er.textContent='';if(!e||!p){er.textContent='Isi email dan kata sandi.';return}
 $('#lb').disabled=true;try{await auth.signInWithEmailAndPassword(e,p)}catch(x){er.textContent=aErr(x);$('#lb').disabled=false}}
async function resetPw(){const e=$('#le').value.trim(),er=$('#lerr');if(!e){er.textContent='Isi email dulu, lalu klik Lupa kata sandi.';return}
 try{await auth.sendPasswordResetEmail(e);toast('Link ganti kata sandi dikirim ke '+e)}catch(x){er.textContent=aErr(x)}}
async function firstAdmin(){const n=$('#fn').value.trim(),e=$('#fe').value.trim(),p=$('#f1').value,er=$('#lerr');er.textContent='';
 if(!n)return er.textContent='Isi nama.';if(p.length<6)return er.textContent='Kata sandi minimal 6 karakter.';if(p!==$('#f2').value)return er.textContent='Kata sandi tidak sama.';
 $('#lb').disabled=true;try{const c=await auth.createUserWithEmailAndPassword(e,p),uid=c.user.uid,b=db.batch();
  b.set(db.doc('users/'+uid),{name:n,email:e,role:'admin',on:true});b.set(db.doc('meta/setup'),{done:true,uid,at:Date.now()});await b.commit()}catch(x){er.textContent=aErr(x);$('#lb').disabled=false}}
function logout(){unData.forEach(f=>f());unData=[];close();auth.signOut()}
const hero=()=>`<div class="lart">${padArt('Nintendo Switch')}${padArt('PS5')}${padArt('Xbox')}</div>`;
function vLogin(){if($('#le')||$('#fn'))return;const a=$('#app');
 if(!S.setupKnown){a.innerHTML='<p class="mu">Memuat…</p>';return}
 if(!S.setup){a.innerHTML=`<div class="login">${hero()}<h2>Selamat datang!</h2><p>Buat akun Admin untuk pemilik. Kasir ditambahkan nanti di Pengaturan.</p><div class="card"><label for="fn" style="margin-top:0">Nama</label><input id="fn" placeholder="Nama pemilik" autocomplete="name"><label for="fe">Email</label><input id="fe" type="email" placeholder="nama@gmail.com" autocomplete="email"><label for="f1">Kata sandi (min. 6 karakter)</label><input id="f1" type="password" autocomplete="new-password"><label for="f2">Ulangi kata sandi</label><input id="f2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')firstAdmin()"><p class="err" id="lerr" role="alert"></p><button class="p" id="lb" style="width:100%;margin-top:12px" onclick="firstAdmin()">Buat akun Admin</button></div></div>`;return}
 a.innerHTML=`<div class="login">${hero()}<h2>Siap main?</h2><p>Masuk dengan email dan kata sandi akun staf.</p><div class="card"><label for="le" style="margin-top:0">Email</label><input id="le" type="email" autocomplete="username" placeholder="nama@gmail.com"><label for="lp">Kata sandi</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><p class="err" id="lerr" role="alert"></p><button class="p" id="lb" style="width:100%;margin-top:12px" onclick="login()">Masuk</button><div style="text-align:center;margin-top:8px"><button class="link" onclick="resetPw()">Lupa kata sandi?</button></div></div></div>`}
function vNoAccess(){const a=$('#app');if(!S.meReady){a.innerHTML='<p class="mu">Memeriksa akun…</p>';return}
 a.innerHTML=`<div class="login">${hero()}<h2>Akun belum terdaftar</h2><p>${esc(authUser.email)} belum terdaftar sebagai staf aktif. Minta Admin menambahkan email ini di Pengaturan → Akun staf.</p><button onclick="logout()">Keluar</button></div>`}
const nAdm=ex=>S.users.filter(x=>x.role==='admin'&&x.on!==false&&x.id!==ex).length;
function userM(id){const u=S.users.find(x=>x.id===id)||{name:'',email:'',role:'kasir',on:true};
 open(`<h3>${id?'Ubah':'Tambah'} Staf</h3><label for="nn">Nama</label><input id="nn" value="${esc(u.name)}">
 ${id?`<label>Email</label><div class="mu" style="font-size:15px">${esc(u.email)}</div>`:`<label for="ne">Email</label><input id="ne" type="email" placeholder="kasir@gmail.com"><label for="np">Kata sandi awal (min. 6 karakter)</label><input id="np" type="text" autocomplete="off"><p class="mu" style="margin:6px 0 0">Berikan kata sandi ini ke staf. Mereka bisa menggantinya lewat "Lupa kata sandi?".</p>`}
 <label>Peran</label><div class="seg" style="grid-template-columns:1fr 1fr"><label><input type="radio" name="nr" value="kasir" ${u.role!=='admin'?'checked':''}><span>Kasir</span></label><label><input type="radio" name="nr" value="admin" ${u.role==='admin'?'checked':''}><span>Admin</span></label></div>
 <label class="check" style="margin-top:14px"><input id="na" type="checkbox" ${u.on!==false?'checked':''}>Akun aktif</label>
 ${id&&u.email?`<button class="link" style="margin-top:8px" onclick="sendReset('${esc(u.email)}')">Kirim email ganti kata sandi</button>`:''}
 <p class="err" id="uerr" role="alert"></p>
 <div class="foot">${id&&id!==me?`<button class="d" onclick="delUser('${id}')">Hapus</button>`:`<button onclick="close()">Batal</button>`}<button class="p" id="ub" onclick="saveUser('${id||''}')">Simpan</button></div>`)}
async function sendReset(e){try{await auth.sendPasswordResetEmail(e);toast('Email ganti kata sandi dikirim ke '+e)}catch(x){toast(aErr(x))}}
async function saveUser(id){const n=$('#nn').value.trim(),r=(document.querySelector('input[name=nr]:checked')||{}).value||'kasir',on=$('#na').checked,o=S.users.find(x=>x.id===id)||{},er=$('#uerr');er.textContent='';
 if(!n)return er.textContent='Isi nama.';
 if(o.role==='admin'&&(r!=='admin'||!on)&&!nAdm(id))return er.textContent='Harus ada minimal satu Admin aktif.';
 $('#ub').disabled=true;
 try{if(id){await db.doc('users/'+id).update({name:n,role:r,on})}
  else{const e=$('#ne').value.trim(),p=$('#np').value;if(p.length<6)throw{code:'auth/weak-password'};
   const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(fbCfg,'sec');const c=await sec.auth().createUserWithEmailAndPassword(e,p);await sec.auth().signOut();
   await db.doc('users/'+c.user.uid).set({name:n,email:e,role:r,on})}
  close();toast('Akun staf disimpan')}catch(x){er.textContent=x.code&&x.code.startsWith('auth/')?aErr(x):(x.code==='permission-denied'?'Tidak punya izin.':x.message||String(x));$('#ub').disabled=false}}
async function delUser(id){const o=S.users.find(x=>x.id===id);if(o.role==='admin'&&!nAdm(id))return toast('Harus ada minimal satu Admin aktif');try{await db.doc('users/'+id).delete();close();toast('Akses staf dicabut')}catch(e){dbErr(e)}}

/* ---------- data ---------- */
function subAll(){
 const sub=(p,f)=>unData.push(db.collection(p).onSnapshot(s=>{f(s.docs.map(d=>({id:d.id,...d.data()})));render()},dbErr));
 unData.push(db.doc('settings/main').onSnapshot(s=>{S.cfg=s.exists?s.data():null;S.cfgReady=true;render()},dbErr));
 unData.push(db.doc('meta/legacy').onSnapshot(s=>{S.legacy=s.exists&&s.data().names||{};names();render()},()=>{}));
 sub('users',l=>{S.users=l;names()});sub('units',l=>S.units=l.sort((a,b)=>(a.ord||0)-(b.ord||0)));sub('products',l=>S.prods=l);sub('stock',l=>{S.stock={};l.forEach(x=>S.stock[x.id]=x.qty)});
 sub('members',l=>{S.members={};l.forEach(x=>S.members[x.id]=x)});sub('active',l=>{S.act={};l.forEach(x=>S.act[x.id]=x)});sub('voids',l=>{S.voids={};l.forEach(x=>S.voids[x.id]=x)});
 unData.push(db.collection('trx').orderBy('at','desc').limit(1000).onSnapshot(s=>{S.trx=s.docs.map(d=>({id:d.id,...d.data()}));render()},dbErr));
}
function names(){S.names={...S.legacy};S.users.forEach(u=>S.names[u.id]=u.name)}

/* ---------- boot ---------- */
(async()=>{
 try{fbCfg=await (await fetch('/__/firebase/init.json')).json();firebase.initializeApp(fbCfg)}
 catch(e){$('#app').innerHTML='<div class="card">Konfigurasi Firebase tidak ditemukan. Halaman ini harus dibuka dari Firebase Hosting (alamat .web.app).</div>';return}
 auth=firebase.auth();db=firebase.firestore();
 db.doc('meta/setup').onSnapshot(s=>{S.setup=s.exists;S.setupKnown=true;if(!authUser)render()},()=>{S.setupKnown=true;S.setup=true;render()});
 auth.onAuthStateChanged(u=>{authUser=u;if(unMe){unMe();unMe=null}unData.forEach(f=>f());unData=[];cur=null;admin=false;me='';S.meReady=false;S.cfgReady=false;tab='Dashboard';
  if(!u){render();return}
  me=u.uid;idle=Date.now();render();
  unMe=db.doc('users/'+u.uid).onSnapshot(s=>{S.meReady=true;const d=s.exists?{id:s.id,...s.data()}:null,was=!!cur;
   if(d&&d.on!==false){cur=d;admin=d.role==='admin';if(!was)subAll()}else{cur=null;admin=false;if(was){unData.forEach(f=>f());unData=[]}}render()},()=>{S.meReady=true;render()});
 });
 ['pointerdown','keydown'].forEach(e=>document.addEventListener(e,()=>idle=Date.now()));setInterval(tick,1000);document.addEventListener('click',()=>ctx.resume&&ctx.resume(),{once:true});
})();
</script></body></html>
